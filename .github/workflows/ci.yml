name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (packages — tsc strict is the typecheck)
        run: pnpm build

      - name: Typecheck dashboard
        run: pnpm --filter @jarvis/dashboard typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
